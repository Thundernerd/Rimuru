[package]
name = "csrinru-desktop"
version = "0.1.0"
edition = "2021"
description = "A desktop application for browsing and installing games from cs.rin.ru forum"
authors = ["CsRinRu Team"]

[lib]
name = "csrinru_desktop"
path = "src/lib.rs"

[[bin]]
name = "csrinru-desktop"
path = "src/main.rs"

[dependencies]
# HTTP client for fetching forum pages and database APIs
reqwest = { version = "0.11", features = ["json", "blocking"] }

# HTML parsing for forum scraping
scraper = "0.17"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Regular expressions for content parsing
regex = "1.10"

# Date and time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Tauri framework for desktop UI
tauri = { version = "1.5", features = ["api-all"] }

[dev-dependencies]
mockito = "1.2"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
