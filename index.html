<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RinRu Desktop</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header>
      <h1>RinRu Desktop</h1>
      <span id="session">Checking session…</span>
      <button id="sign-in" type="button">Sign in</button>
      <button id="show-forum" type="button">Show forum window</button>
    </header>

    <main>
      <section id="forum-pane">
        <form id="forum-form">
          <label>Forum id <input id="forum-id" type="number" value="10" min="1" /></label>
          <button type="submit">Load</button>
          <button id="prev" type="button" disabled>‹ Prev</button>
          <button id="next" type="button" disabled>Next ›</button>
          <button id="snapshot-forum" type="button">Save HTML</button>
        </form>
        <h2 id="forum-title"></h2>
        <ol id="topics"></ol>
      </section>

      <section id="topic-pane">
        <div class="toolbar">
          <h2 id="topic-title">Select a topic</h2>
          <button id="snapshot-topic" type="button" disabled>Save HTML</button>
        </div>
        <div id="posts"></div>
      </section>
    </main>

    <footer id="status"></footer>
  </body>
</html>
